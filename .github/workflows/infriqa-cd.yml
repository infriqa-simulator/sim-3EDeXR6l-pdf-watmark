name: CD Pipeline
'on':
  push:
    branches:
    - InfrIQa
    - InfrIQa-dev
    - dev
    - development
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false
env:
  AZURE_SUBSCRIPTION_ID: 8e01f6cc-5b9c-4ef8-b1b6-d22da79fc819
  AZURE_RESOURCE_GROUP: sim-3EDeXR6l-pdf-watmark-dev-rg
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.12'
jobs:
  deploy-frontend-sim-3edexr6l-pdf-watmark-dev-pdf-watermarker-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Set Active Azure Subscription
      run: az account set --subscription ${{ env.AZURE_SUBSCRIPTION_ID }}
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
    - name: Install dependencies
      run: npm install
    - name: Set Frontend Environment Variables
      run: echo "API_URL=https://sim-3edexr6l-pdf-watmark-dev-pdf--da5vvx5.livelydune-1c8a5079.centralus.azurecontainerapps.io" >> .env && echo "API_URL=https://sim-3edexr6l-pdf-watmark-dev-pdf--da5vvx5.livelydune-1c8a5079.centralus.azurecontainerapps.io" >> .env.production
    - name: Build frontend
      run: npm run build
    - name: Deploy to Azure Static Web Apps
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.STATIC_WEB_APP }}
        repo_token: ${{ github.token }}
        action: upload
        app_location: dist
        output_location: ''
        skip_app_build: true
    - name: Verify Frontend Deployment
      run: "echo 'Verifying frontend deployment health at https://orange-moss-0a02fbe10.7.azurestaticapps.net...'\nsuccess=false\nwait_sec=5\nfor i in {1..10}; do\n  if curl -s -f \"https://orange-moss-0a02fbe10.7.azurestaticapps.net\" > /dev/null; then\n    echo '\u2705 Frontend health check passed!'\n    success=true\n    break\n  fi\n  echo \"Attempt $i failed. Retrying in ${wait_sec}s...\"\n  sleep $wait_sec\n  wait_sec=$((wait_sec * 2 > 120 ? 120 : wait_sec * 2))\ndone\nif [ \"$success\" = false ]; then\n  echo '\u274C Frontend health check failed after all attempts.'\n  exit 1\nfi"
  deploy-backend-sim-3edexr6l-pdf-watmark-dev-pdf:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Set Active Azure Subscription
      run: az account set --subscription ${{ env.AZURE_SUBSCRIPTION_ID }}
    - name: Login to ACR
      run: az acr login --name sim3edexr6lpdfwatmarkdevinfrastructure1
    - name: Build and Push Docker Image
      run: |-
        docker build -t sim3edexr6lpdfwatmarkdevinfrastructure1.azurecr.io/sim-3edexr6l-pdf-watmark-dev-pdf:${{ github.sha }} -t sim3edexr6lpdfwatmarkdevinfrastructure1.azurecr.io/sim-3edexr6l-pdf-watmark-dev-pdf:latest -f pdf-watermarker/Dockerfile pdf-watermarker
        docker push sim3edexr6lpdfwatmarkdevinfrastructure1.azurecr.io/sim-3edexr6l-pdf-watmark-dev-pdf:${{ github.sha }}
        docker push sim3edexr6lpdfwatmarkdevinfrastructure1.azurecr.io/sim-3edexr6l-pdf-watmark-dev-pdf:latest
    - name: Deploy to Container App
      run: |-
        ACR_USER=$(az acr credential show --name sim3edexr6lpdfwatmarkdevinfrastructure1 --query 'username' -o tsv)
        ACR_PASS=$(az acr credential show --name sim3edexr6lpdfwatmarkdevinfrastructure1 --query 'passwords[0].value' -o tsv)
        az containerapp registry set \
          --name sim-3edexr6l-pdf-watmark-dev-pdf \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --server sim3edexr6lpdfwatmarkdevinfrastructure1.azurecr.io \
          --username "$ACR_USER" \
          --password "$ACR_PASS"
        az containerapp ingress update \
          --name sim-3edexr6l-pdf-watmark-dev-pdf \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --target-port 8999
        az containerapp update \
          --name sim-3edexr6l-pdf-watmark-dev-pdf \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --image sim3edexr6lpdfwatmarkdevinfrastructure1.azurecr.io/sim-3edexr6l-pdf-watmark-dev-pdf:${{ github.sha }}
    - name: Verify Container App Deployment
      run: "echo 'Verifying container app deployment health at https://sim-3edexr6l-pdf-watmark-dev-pdf.livelydune-1c8a5079.centralus.azurecontainerapps.io...'\nsuccess=false\nwait_sec=5\nfor i in {1..10}; do\n  if curl -s -f --connect-timeout 5 --max-time 10 \"https://sim-3edexr6l-pdf-watmark-dev-pdf.livelydune-1c8a5079.centralus.azurecontainerapps.io/health\" > /dev/null || curl -s -f --connect-timeout 5 --max-time 10 \"https://sim-3edexr6l-pdf-watmark-dev-pdf.livelydune-1c8a5079.centralus.azurecontainerapps.io/api/health\" > /dev/null || curl -s -f --connect-timeout 5 --max-time 10 \"https://sim-3edexr6l-pdf-watmark-dev-pdf.livelydune-1c8a5079.centralus.azurecontainerapps.io\" > /dev/null; then\n    echo '\u2705 Container app health check passed!'\n    success=true\n    break\n  fi\n  echo \"Attempt $i failed. Retrying in ${wait_sec}s...\"\n  sleep $wait_sec\n  wait_sec=$((wait_sec * 2 > 120 ? 120 : wait_sec * 2))\ndone\nif [ \"$success\" = false ]; then\n  echo '\u274C Container app\
        \ health check failed after all attempts.'\n  exit 1\nfi"
  configure-cors:
    runs-on: ubuntu-latest
    needs:
    - deploy-frontend-sim-3edexr6l-pdf-watmark-dev-pdf-watermarker-frontend
    - deploy-backend-sim-3edexr6l-pdf-watmark-dev-pdf
    steps:
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Set Active Azure Subscription
      run: az account set --subscription ${{ env.AZURE_SUBSCRIPTION_ID }}
    - name: Configure CORS and Frontend URL on Backend
      run: |-
        echo "Fetching Static Web App actual live hostname..."
        FRONTEND_HOST=$(az staticwebapp environment list --name sim-3edexr6l-pdf-watmark-dev-pdf-watermarker-frontend \
          --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
          --query "[0].hostname" -o tsv)
        if [ -z "$FRONTEND_HOST" ]; then
          echo "Could not fetch SWA hostname via environment list, trying fallback..."
          FRONTEND_HOST=$(az staticwebapp show --name sim-3edexr6l-pdf-watmark-dev-pdf-watermarker-frontend \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "defaultHostname" -o tsv)
        fi
        if [ -z "$FRONTEND_HOST" ]; then
          echo "Could not fetch SWA hostname. Skipping CORS configuration."
          exit 0
        fi
        echo "Frontend hostname: $FRONTEND_HOST"
        echo "Setting CORS on container app: sim-3edexr6l-pdf-watmark-dev-pdf..."
        az containerapp update --name sim-3edexr6l-pdf-watmark-dev-pdf --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --cors-allowed-origins "https://$FRONTEND_HOST"
